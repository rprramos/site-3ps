name: Atualizar portfólio do YouTube

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 6h (horário de Brasília)
  workflow_dispatch:       # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/atualizar-youtube.mjs
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain data/youtube.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/youtube.json
            git commit -m "Portfólio: novos vídeos do YouTube"
            git push
          fi
